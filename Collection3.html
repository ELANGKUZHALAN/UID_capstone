<!DOCTYPE html>
<html>
<head>
<title>Jewelry - Boutique</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;

    background: linear-gradient(rgba(255,255,255,0.9), rgba(255,255,255,0.95)),
    url('https://images.unsplash.com/photo-1515562141207-7a88fb7ce338') no-repeat center/cover;

    background-attachment: fixed;
}

/* NAVBAR */
.nav-container {
    position: fixed;
    top: 0;
    width: 100%;
    padding: 15px;
    text-align: center;

    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
}

.nav-item {
    margin: 0 15px;
    text-decoration: none;
    color: white;
}

/* HEADER */
.header {
    margin-top: 60px;
    padding: 60px;
    text-align: center;
}

.header h1 {
    font-size: 40px;
}

/* GRID */
.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
    gap: 30px;
    padding: 40px;
}

/* CARD */
.card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    transition: 0.3s;

    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

.card:hover {
    transform: translateY(-10px);
}

/* IMAGE */
.card img {
    width: 100%;
    height: 250px;
    object-fit: cover;
}

/* CONTENT */
.card-content {
    padding: 15px;
}

.card-content h3 {
    margin: 10px 0;
}

.price {
    color: #b08968;
    font-weight: bold;
}

/* BUTTON */
.btn {
    display: inline-block;
    margin-top: 10px;
    padding: 10px 15px;
    background: black;
    color: white;
    text-decoration: none;
}

/* FOOTER */
.footer {
    text-align: center;
    padding: 30px;
    background: black;
    color: white;
}
</style>

</head>

<script src="script.js"></script>
<body>

<!-- NAV -->
<div class="nav-container">
    <a href="index.html" class="nav-item">INDEX</a>
    <a href="Collection.html" class="nav-item">BACK</a>
    <a href="cart.html" class="nav-item">CART🛒</a>
</div>

<!-- HEADER -->
<div class="header">
    <h1>Artisan Jewelry Collection</h1>
    <p>Elegant handcrafted jewelry pieces</p>
</div>

<!-- PRODUCTS -->
<div class="products">

    <div class="card">
        <img src="https://images.unsplash.com/photo-1611652022419-a9419f74343d">
        <div class="card-content">
            <h3>Gold Necklace</h3>
            <p>Handcrafted gold</p>
            <div class="price">₹14999</div>
            <button class="btn" onclick="addToCart('Gold Necklace', 14999)">Add to Cart</button>
        </div>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1608042314453-ae338d80c427">
        <div class="card-content">
            <h3>Silver Rings</h3>
            <p>Elegant rings</p>
            <div class="price">₹3999</div>
            <button class="btn" onclick="addToCart('Silver Rings', 3999)">Add to Cart</button>
        </div>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1515562141207-7a88fb7ce338">
        <div class="card-content">
            <h3>Bracelet</h3>
            <p>Classic style</p>
            <div class="price">₹2999</div>
            <button class="btn" onclick="addToCart('Bracelet', 2999)">Add to Cart</button>
        </div>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1535632066927-ab7c9ab60908">
        <div class="card-content">
            <h3>Earrings</h3>
            <p>Modern design</p>
            <div class="price">₹1999</div>
            <button class="btn" onclick="addToCart('Earrings', 1999)">Add to Cart</button>
        </div>
    </div>

</div>

<!-- FOOTER -->
<div class="footer">
    © 2026 Boutique Shop
</div>

</body>
</html>

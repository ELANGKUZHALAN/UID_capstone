<!DOCTYPE html>
<html>
<head>
    <title>Your Cart</title>
    <link rel="stylesheet" href="style.css">

    <style>
        /* ===== CART PAGE DESIGN ===== */

/* Page background */
body {
    font-family: 'Poppins', sans-serif;
    background: #fff7f9;
    margin: 0;
    padding: 0;
}

/* Title */
h1 {
    text-align: center;
    margin-top: 30px;
    color: #333;
}

/* Cart container */
#cart-items {
    width: 80%;
    margin: 30px auto;
}

/* Each product box */
.cart-item {
    display: flex;
    flex-direction: column;   /* 🔥 THIS MAKES EVERYTHING STACK */
    align-items: flex-start;

    background: white;
    padding: 20px;
    margin-bottom: 20px;

    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

/* Product image */
.cart-item img {
    width: 80px;
    border-radius: 10px;
}

/* Product name */
.cart-item h4 {
    margin: 5px 0;
    font-size: 18px;
}

.cart-item p {
    margin: 5px 0;
    color: #ff4d6d;
    font-weight: bold;
}

.cart-item button {
    margin-top: 10px;
    width: 100%;   /* full width button */
}

/* Total price */
#total {
    text-align: center;
    font-size: 22px;
    margin-top: 20px;
}

/* Continue shopping button */
a {
    display: block;
    text-align: center;
    margin: 20px auto;
    background: black;
    color: white;
    padding: 10px 15px;
    text-decoration: none;
    border-radius: 5px;
    width: 200px;
}
    </style>
</head>

<body>
    

<h1>Your Cart 🛒</h1>

<div id="cart-items">
<br>
</div>

<h2 id="total">Total: ₹0</h2><br>

<a href="index.html">⬅ Continue Shopping</a>

<script src="script.js"></script>

</body>
</html>
